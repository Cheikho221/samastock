<style>
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --ink:#12302C; --muted:#5C706C; --line:#DCE3DD;
  --brand:#0F4C45; --on-brand:#FFFFFF; --accent:#F5B301; --on-accent:#2A2000;
  --danger:#B93227; --danger-bg:#FBE8E5; --ok:#2C7A4B; --active:#0F4C45; --backdrop:rgba(10,25,22,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1917; --surface:#152522; --ink:#EAF2EF; --muted:#93A8A3; --line:#25403B;
    --brand:#1B5E54; --on-brand:#F2FAF8; --accent:#F5B301; --on-accent:#2A2000;
    --danger:#FF8A7E; --danger-bg:#3A1E1B; --ok:#6FD196; --active:#F5B301; --backdrop:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1917; --surface:#152522; --ink:#EAF2EF; --muted:#93A8A3; --line:#25403B;
  --brand:#1B5E54; --on-brand:#F2FAF8; --accent:#F5B301; --on-accent:#2A2000;
  --danger:#FF8A7E; --danger-bg:#3A1E1B; --ok:#6FD196; --active:#F5B301; --backdrop:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:520px){#app{border-inline:1px solid var(--line)}}
main{flex:1;overflow-y:auto;padding:16px 18px 28px}
main.center{display:flex;flex-direction:column;justify-content:center}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.top .date{color:var(--muted);font-size:14px}
h2{font-size:17px;font-weight:800;margin:26px 0 4px}
.muted{color:var(--muted)}

.logo{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--brand)}
.brandrow{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.hrow{display:flex;align-items:center;gap:10px;min-width:0}
.hrow h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{color:var(--accent)}}
:root[data-theme="dark"] .logo{color:var(--accent)}
.msg{padding:12px 14px;border-radius:12px;background:var(--danger-bg);color:var(--danger);font-weight:600;margin-top:14px}
.msg.info{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

.banner{display:block;width:100%;text-align:left;padding:10px 14px;min-height:44px;margin-bottom:12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--accent);font-size:14px}

.hero{background:var(--brand);color:var(--on-brand);border-radius:20px;padding:20px 20px 18px}
.hero .label{font-size:15px;opacity:.85}
.hero .big{font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:2px 0 14px}
.hero .big small{font-size:18px;font-weight:600;opacity:.85;letter-spacing:0;margin-left:4px}
.hero .facts{display:flex;gap:28px;margin-bottom:18px}
.hero .facts div span{display:block;font-size:13px;opacity:.8}
.hero .facts div b{font-size:18px;font-weight:800}
.cta{width:100%;min-height:54px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:18px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px}
.tile span{display:block;font-size:14px;color:var(--muted)}
.tile b{display:block;font-size:24px;font-weight:800;line-height:1.2}
.tile em{font-style:normal;font-size:13px;color:var(--muted)}
.tile.warn b{color:var(--danger)}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .name{font-weight:600}
.row .meta{font-size:14px;color:var(--muted)}
.row .right{text-align:right;white-space:nowrap}
.row.off{opacity:.5}
.pick[aria-pressed="true"]{background:var(--bg);box-shadow:inset 5px 0 0 var(--accent);padding-left:14px}
.badge{display:inline-block;min-width:44px;text-align:center;padding:4px 10px;border-radius:99px;font-weight:800;background:var(--line);color:var(--ink)}
.badge.low{background:var(--danger-bg);color:var(--danger)}
.pill-low{color:var(--danger);font-weight:600}
.ok{color:var(--ok);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:12px;background:var(--brand);color:var(--on-brand);font-weight:700;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;border:2px solid var(--brand);color:var(--ink)}
.btn.small{min-height:44px;padding:0 14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.link{color:var(--ink);text-decoration:underline;min-height:44px;padding:0 4px}

.round{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:24px;font-weight:600;line-height:1}
.round:disabled{opacity:.4}
.round.minus{background:transparent;border:2px solid var(--brand);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:24px;text-align:center;font-size:18px}

.cartbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line)}
.cartbar .sum span{display:block;font-size:13px;color:var(--muted)}
.cartbar .sum b{font-size:19px;white-space:nowrap}
.cartbar .acts{display:flex;gap:8px}
.cartbar .btn{background:var(--accent);color:var(--on-accent);padding:0 14px}
.cartbar .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--brand)}
.cartbar .btn:disabled{opacity:.45;cursor:not-allowed}

nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;min-height:56px;color:var(--muted);font-size:12px;font-weight:600}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--active)}

.chips{display:flex;gap:8px;margin:4px 0 8px;overflow-x:auto}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;margin-right:6px}
.tag.vente{background:var(--brand);color:var(--on-brand)}
.tag.entree,.tag.paiement{background:var(--ok);color:#fff}
.tag.sortie{background:var(--danger);color:#fff}
.tag.credit{background:var(--accent);color:var(--on-accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.entree,:root:not([data-theme="light"]) .tag.paiement{color:#06210f}:root:not([data-theme="light"]) .tag.sortie{color:#3a0d08}}
:root[data-theme="dark"] .tag.entree,:root[data-theme="dark"] .tag.paiement{color:#06210f}:root[data-theme="dark"] .tag.sortie{color:#3a0d08}

.plan{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;margin-top:12px}
.plan.current{border-color:var(--brand)}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan .ph b{font-size:18px}
.plan .price{font-size:26px;font-weight:800;margin:4px 0 8px}
.plan .price small{font-size:14px;font-weight:600;color:var(--muted)}
.plan ul{margin:0 0 14px;padding-left:20px;color:var(--muted)}
.plan ul li{margin:2px 0}
.status{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

.empty{padding:20px 0;color:var(--muted)}

.backdrop{position:absolute;inset:0;background:var(--backdrop);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 8px;font-size:22px;font-weight:800}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-bottom:16px}
.kv span{color:var(--muted)}
.kv b{text-align:right}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.one{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0 6px}
.close{float:right;min-width:44px;min-height:44px;font-size:26px;color:var(--muted)}
.owe{font-size:34px;font-weight:800;line-height:1.1;margin:2px 0 4px}
.owe.zero{color:var(--ok)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--danger);color:#fff}
.foot{margin-top:28px;font-size:14px;color:var(--muted)}
</style>
</head>

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function fmt(n){ return num(n)+' FCFA'; }

  function byId(id){ return S.products.filter(function(p){return p.id===id;})[0]; }
  function custById(id){ return S.customers.filter(function(c){return c.id===id;})[0]; }
  function activeProducts(){ return S.products.filter(function(p){return !p.archived;}); }
  function isLow(p){ return p.qty <= p.alert_threshold; }
  function isToday(t){ return new Date(t).toDateString() === new Date().toDateString(); }
  function totalOwed(){ return S.customers.reduce(function(a,c){ return a+Math.max(0,c.balance); },0); }
  function prodName(id){ var p=byId(id); return p?p.name:'Produit retiré'; }

  function todayStats(){
    var rev=0, profit=0, cash=0, count=0;
    S.sales.forEach(function(s){
      if(!isToday(s.created_at)) return;
      count++; rev+=s.total;
      if(!s.customer_id) cash+=s.total;
      (s.sale_items||[]).forEach(function(it){ profit+=it.qty*(it.sell_price-it.buy_price); });
    });
    S.payments.forEach(function(o){ if(isToday(o.created_at)) cash+=o.amount; });
    return {rev:rev, profit:profit, cash:cash, count:count};
  }
  function cartTotals(){
    var items=0,total=0;
    Object.keys(ui.cart).forEach(function(k){ var q=ui.cart[k], p=byId(k); if(p&&q>0){ items+=q; total+=q*p.sell_price; } });
    return {items:items,total:total};
  }
  function timeLabel(t){
    var d=new Date(t), h=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return isToday(t) ? h : d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+h;
  }
  function dateLabel(t){ return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); }

  function plan(){
    var s=S.sub; if(!s) return {type:'gratuit'};
    if(s.plan==='gratuit') return {type:'gratuit'};
    var end=new Date(s.ends_at).getTime();
    if(end<Date.now()) return {type:'gratuit',expired:true};
    return {type:s.plan,days:Math.max(1,Math.ceil((end-Date.now())/DAY)),end:end};
  }
  function blocked(kind){
    if(plan().type!=='gratuit') return false;
    var n = kind==='produits' ? activeProducts().length : S.customers.length;
    if(n>=LIM[kind]){
      ui.sheet={type:'plan',why: kind==='produits' ? 'Le plan Gratuit permet '+LIM.produits+' produits au maximum.' : 'Le plan Gratuit permet '+LIM.clients+' clients à crédit au maximum.'};
      render(); return true;
    }
    return false;
  }

  async function refresh(){
    var r0 = await sb.from('shops').select('*').maybeSingle();
    if(r0.error) throw r0.error;
    S.shop = r0.data;
    if(!S.shop){ S.products=[]; S.customers=[]; S.sales=[]; S.moves=[]; S.payments=[]; S.sub=null; return; }

    async function loadSales(){
      var r = await sb.from('sales').select('id,customer_id,total,created_at,sale_items(product_name,qty,buy_price,sell_price)').order('created_at',{ascending:false}).limit(150);
      if(r.error){
        r = await sb.from('sales').select('id,customer_id,total,created_at').order('created_at',{ascending:false}).limit(150);
        S.noItems = true;
      } else { S.noItems = false; }
      return r;
    }
    var res = await Promise.all([
      sb.from('products').select('*').order('name'),
      sb.from('customer_balances').select('*').order('name'),
      loadSales(),
      sb.from('stock_movements').select('id,product_id,kind,qty,created_at').order('created_at',{ascending:false}).limit(150),
      sb.from('debt_payments').select('id,customer_id,amount,created_at').order('created_at',{ascending:false}).limit(150),
      sb.from('subscriptions').select('*').maybeSingle()
    ]);
    res.forEach(function(r){ if(r.error) throw r.error; });
    S.products = res[0].data || [];
    S.customers = (res[1].data || []).map(function(c){ return {id:c.customer_id,name:c.name,phone:c.phone||'',balance:Number(c.balance)||0}; });
    S.sales = res[2].data || [];
    S.moves = res[3].data || [];
    S.payments = res[4].data || [];
    S.sub = res[5].data || null;
  }

  function sellList(){
    var q=ui.q.trim().toLowerCase();
    var all=activeProducts();
    if(!all.length) return '<div class="empty">Aucun produit. Ajoute-en dans l\'onglet Stock pour commencer à vendre.</div>';
    var list=all.filter(function(p){ return !q || p.name.toLowerCase().indexOf(q)>-1; });
    if(!list.length) return '<div class="empty">Aucun produit trouvé. Vérifie l\'orthographe ou ajoute-le dans Stock.</div>';
    return list.map(function(p){
      var q2=ui.cart[p.id]||0, out=p.qty<=0, ctl;
      if(out){ ctl='<span class="pill-low">Rupture</span>'; }
      else if(q2===0){ ctl='<button class="round" data-a="add" data-id="'+esc(p.id)+'" aria-label="Ajouter '+esc(p.name)+'">+</button>'; }
      else { ctl='<div class="stepper"><button class="round minus" data-a="sub" data-id="'+esc(p.id)+'" aria-label="Retirer un '+esc(p.name)+'">−</button><b>'+q2+'</b><button class="round" data-a="add" data-id="'+esc(p.id)+'" aria-label="Ajouter un '+esc(p.name)+'"'+(q2>=p.qty?' disabled':'')+'>+</button></div>'; }
      return '<div class="row'+(out?' off':'')+'"><div><div class="name">'+esc(p.name)+'</div><div class="meta">'+fmt(p.sell_price)+' &nbsp;|&nbsp; en stock : '+p.qty+'</div></div>'+ctl+'</div>';
    }).join('');

      var t=cartTotals();
      var rows=S.customers.map(function(c){
        return '<button class="row pick" data-a="creditPick" data-id="'+esc(c.id)+'" aria-pressed="'+(s.sel===c.id)+'"><div class="name">'+esc(c.name)+'</div><div class="meta">'+(c.balance>0?'Doit déjà '+fmt(c.balance):'Aucune dette')+'</div></button>';
      }).join('');
      return sheetWrap('Vente à crédit','<h3>Vente à crédit</h3><p class="muted" style="margin:0 0 8px">Total : <b style="color:var(--ink)">'+fmt(t.total)+'</b>. Choisis qui paiera plus tard.</p>'+rows+
        '<h2 style="margin:16px 0 0">Nouveau client</h2>'+
        '<label for="c-name">Nom</label><input id="c-name" type="text" placeholder="Ex. Awa Diop" autocomplete="off">'+
        '<label for="c-phone">Téléphone (facultatif)</label><input id="c-phone" type="tel" inputmode="tel" placeholder="Ex. 77 123 45 67">'+
        '<div class="one"><button class="btn" data-a="creditConfirm">Enregistrer la dette</button></div>');
    }

    if(s.type==='clientForm'){
      return sheetWrap('Nouveau client','<h3>Nouveau client</h3>'+
        '<label for="c-name">Nom</label><input id="c-name" type="text" placeholder="Ex. Awa Diop" autocomplete="off">'+
        '<label for="c-phone">Téléphone (facultatif)</label><input id="c-phone" type="tel" inputmode="tel" placeholder="Ex. 77 123 45 67">'+
        '<div class="one"><button class="btn" data-a="saveClient">Enregistrer le client</button></div>');
    }

    if(s.type==='client'){
      var c=custById(s.id); if(!c) return '';
      var b=c.balance, pl=plan();
      var opsAll=[];
      S.sales.forEach(function(x){ if(x.customer_id===c.id) opsAll.push({d:true,amount:x.total,ts:x.created_at}); });
      S.payments.forEach(function(x){ if(x.customer_id===c.id) opsAll.push({d:false,amount:x.amount,ts:x.created_at}); });
      var ops=opsAll.sort(function(x,y){return new Date(y.ts)-new Date(x.ts);}).slice(0,6).map(function(o){
        return '<div class="row"><div><div class="name">'+(o.d?'Crédit':'Paiement')+'</div><div class="meta">'+timeLabel(o.ts)+'</div></div><div class="right"><b class="'+(o.d?'pill-low':'ok')+'">'+(o.d?'+':'−')+num(o.amount)+' FCFA</b></div></div>';
      }).join('');
      var remind='';
      if(b>0 && c.phone){
        if(pl.type==='gratuit') remind='<button class="btn ghost wide" data-a="openPlan" data-why="Les rappels WhatsApp sont inclus dans le plan Pro.">Envoyer un rappel WhatsApp (Pro)</button>';
        else{
          var dg=c.phone.replace(/\D/g,''); if(dg.length===9) dg='221'+dg;
          var txt='Bonjour '+c.name+', petit rappel : vous avez une dette de '+fmt(b)+' à la boutique '+S.shop.name+'. Merci !';
          remind='<a class="btn ghost wide" target="_blank" rel="noopener" href="https://wa.me/'+dg+'?text='+encodeURIComponent(txt)+'">Envoyer un rappel WhatsApp</a>';
        }
      }
      var pay = b>0
        ? '<label for="p-amt">Montant payé (FCFA)</label><input id="p-amt" type="number" inputmode="numeric" min="1" placeholder="Ex. 1000">'+
          '<div class="two"><button class="btn ghost" data-a="payAll" data-amt="'+b+'">Tout payer</button><button class="btn" data-a="payDebt" data-id="'+esc(c.id)+'">Enregistrer le paiement</button></div>'+remind
        : '<p class="ok">Dette soldée. Ce client ne doit rien.</p>';
      return sheetWrap(c.name,'<h3>'+esc(c.name)+'</h3><div class="muted">'+(c.phone?esc(c.phone):'Pas de téléphone')+'</div>'+
        '<div class="muted" style="margin-top:10px">Dette actuelle</div><div class="owe'+(b>0?'':' zero')+'">'+fmt(Math.max(0,b))+'</div>'+pay+
        '<h2 style="margin-top:20px">Dernières opérations</h2>'+(ops||'<div class="empty">Aucune opération.</div>'));
    }

    if(s.type==='plan'){
      var pay2;
      var who='Bonjour, je veux activer SamaStock Pro pour la boutique '+S.shop.name+' (compte : '+(S.user.email||'')+').';
      if(PAY_WAVE || PAY_ORANGE){
        var dn=PAY_WHATSAPP;
        pay2='<div class="kv" style="margin:8px 0 4px"><span>Wave</span><b>'+esc(PAY_WAVE)+'</b><span>Orange Money</span><b>'+esc(PAY_ORANGE)+'</b></div>'+
          '<ol style="margin:6px 0 12px;padding-left:20px"><li>Envoie <b>'+fmt(PRICE)+'</b> à l\'un de ces deux numéros.</li><li>Préviens-nous sur WhatsApp avec la preuve de paiement.</li><li>Ton compte Pro est activé rapidement.</li></ol>'+
          '<div class="one"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+dn+'?text='+encodeURIComponent(who)+'">Prévenir sur WhatsApp</a></div>';
      } else {
        pay2='<p class="muted" style="margin:6px 0 12px">Contacte l\'équipe SamaStock pour activer ton abonnement Pro. Le paiement se fait par Wave ou Orange Money.</p>';
      }
      return sheetWrap('Passer à Pro','<h3>Passer à Pro</h3>'+
        (s.why?'<p style="margin:0 0 10px">'+esc(s.why)+'</p>':'')+
        '<div class="owe">'+num(PRICE)+' <small style="font-size:16px;font-weight:600">FCFA / mois</small></div>'+
        '<ul class="muted" style="margin:6px 0 12px;padding-left:20px"><li>Produits et clients à crédit illimités</li><li>Rappels de dette par WhatsApp</li></ul>'+onlineHTML()+pay2);
    }
    return '';
  }

  function onlineHTML(){
    if(!ONLINE_PAY) return '';
    return '<div class="one" style="margin-top:6px"><button class="btn" data-a="payOnline">Payer '+fmt(PRICE)+' en ligne</button></div>'+
      '<p class="muted" style="font-size:14px;margin:0 0 12px">Wave, Orange Money et autres, sur une page sécurisée PayDunya. Ton abonnement Pro s\'active tout seul.</p>'+
      '<div class="muted" style="font-weight:600">Ou paie à la main</div>';
  }

  function render(){
    var old=document.getElementById('main'), top=old?old.scrollTop:0;
    var html;
    if(!sb){
      html='<main class="center">'+brand('SamaStock')+'<div class="msg" role="alert">Impossible de charger l\'application. Vérifie ta connexion internet et recharge la page.</div><div class="one"><button class="btn" data-a="reloadPage">Recharger</button></div></main>';
    } else if(!ui.ready){
      html='<main class="center">'+brand('SamaStock')+'<p class="muted">Chargement…</p></main>';
    } else if(S.loadError){
      html='<main class="center">'+brand('SamaStock')+'<div class="msg" role="alert">'+esc(S.loadError)+'</div><div class="one"><button class="btn" data-a="retry">Réessayer</button><button class="btn ghost" data-a="logout">Me déconnecter</button></div></main>';
    } else if(!S.user){
      html=authV();
    } else if(!S.shop){
      html=onboardV();
    } else {
      var v=ui.view;
      var body = v==='home'?homeV():v==='sell'?sellV():v==='debts'?debtsV():v==='stock'?stockV():v==='more'?moreV():histV();
      html='<main id="main">'+body+'</main>'+(v==='sell'?cartBar():'')+nav()+sheetHTML();
    }
    $('app').innerHTML=html;
    var m=document.getElementById('main'); if(m) m.scrollTop=top;
  }

  var tt;
  function toast(msg,err,ms){
    var t=$('toast'); t.textContent=msg; t.className='show'+(err?' err':'');
    clearTimeout(tt); tt=setTimeout(function(){ t.className=err?'err':''; }, ms||2800);
  }
  function num0(id){ var raw=$(id).value.trim(); if(raw==='') return NaN; return Number(raw); }

  function fail(e){
    var m=(e&&e.message)?e.message:String(e||'');
    if(m.indexOf('LIMITE_PRODUITS')>-1){ ui.sheet={type:'plan',why:'Le plan Gratuit permet '+LIM.produits+' produits au maximum.'}; render(); return; }
    if(m.indexOf('LIMITE_CLIENTS')>-1){ ui.sheet={type:'plan',why:'Le plan Gratuit permet '+LIM.clients+' clients à crédit au maximum.'}; render(); return; }
    if(m.indexOf('PAIEMENT_TROP_ELEVE')>-1){ toast('Ce montant dépasse la dette du client.',true); return; }
    if(m.indexOf('Stock insuffisant')>-1){ toast(m+'.',true); return; }
    if(/fetch|network|Load failed/i.test(m)){ toast('Pas de connexion. Réessaie quand tu as du réseau.',true,4000); return; }
    toast('Une erreur est survenue : '+m,true,4500);
  }
  async function run(fn){
    if(ui.busy) return;
    ui.busy=true;
    try{ await fn(); }catch(e){ fail(e); }
    finally{ ui.busy=false; }
  }

  /* ------------------------------------------------------------------
     COMPTE
     ------------------------------------------------------------------ */
  function authError(e){
    var m=(e&&e.message)||'';
    if(/Invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
    if(/already registered|already been registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail. Connecte-toi.';
    if(/password/i.test(m) && /(short|least|weak|characters)/i.test(m)) return 'Mot de passe trop court : 6 caractères minimum.';
    if(/not confirmed/i.test(m)) return 'Confirme d\'abord ton e-mail avec le lien que tu as reçu.';
    if(/rate limit|too many/i.test(m)) return 'Trop d\'essais. Attends quelques minutes puis réessaie.';
    if(/fetch|network|Load failed/i.test(m)) return 'Pas de connexion. Réessaie quand tu as du réseau.';
    if(/valid email|invalid.*email/i.test(m)) return 'Cette adresse e-mail n\'est pas valide.';
    return 'Erreur : '+m;
  }
  async function submitAuth(){
    var email=$('a-email').value.trim(), pass=$('a-pass').value;
    ui.authErr=''; ui.authMsg='';
    if(!email || email.indexOf('@')<1){ ui.authErr='Écris ton adresse e-mail.'; return render(); }
    if(pass.length<6){ ui.authErr='Mot de passe trop court : 6 caractères minimum.'; return render(); }
    if(ui.authMode==='signup'){
      var r=await sb.auth.signUp({email:email,password:pass});
      if(r.error){ ui.authErr=authError(r.error); return render(); }
      if(r.data && r.data.session){ S.user=r.data.session.user; await afterLogin(); return; }
      ui.authMode='login'; ui.authMsg='Compte créé. Ouvre l\'e-mail de confirmation que tu as reçu, puis connecte-toi ici.'; render(); return;
    }
    var r2=await sb.auth.signInWithPassword({email:email,password:pass});
    if(r2.error){ ui.authErr=authError(r2.error); return render(); }
    S.user=r2.data.user; await afterLogin();
  }
  async function afterLogin(){
    S.loadError='';
    try{ await refresh(); }catch(e){ S.loadError='Impossible de charger tes données. '+((e&&e.message)||''); }
    ui.view='home'; ui.sheet=null; ui.cart={}; render();
  }
  async function submitShop(){
    var name=$('s-name').value.trim();
    if(!name) return toast('Écris le nom de ta boutique.',true);
    var r=await sb.from('shops').insert({owner_id:S.user.id,name:name});
    if(r.error) return fail(r.error);
    await refresh(); ui.view='home'; render();
    toast('Boutique créée. Ton essai gratuit de 30 jours commence.',false,3800);
  }

  /* ------------------------------------------------------------------
     VENTES, STOCK, DETTES
     ------------------------------------------------------------------ */
  function snapshotQty(){ var m={}; S.products.forEach(function(p){ m[p.id]={qty:p.qty,th:p.alert_threshold}; }); return m; }
  function newAlerts(before){
    var out=[];
    S.products.forEach(function(p){
      var b=before[p.id]; if(!b || p.archived) return;
      if(b.qty>b.th && p.qty<=p.alert_threshold) out.push(p.name+' (reste '+p.qty+')');
    });
    return out;
  }

  async function completeSale(cid){
    var items=Object.keys(ui.cart).filter(function(k){return ui.cart[k]>0;}).map(function(k){return {product_id:k,qty:ui.cart[k]};});
    if(!items.length) return;
    var total=cartTotals().total, before=snapshotQty();
    var r=await sb.rpc('record_sale',{p_shop_id:S.shop.id,p_customer_id:cid||null,p_items:items});
    if(r.error) return fail(r.error);
    ui.cart={}; ui.sheet=null;
    await refresh(); render();
    var alerts=newAlerts(before);
    var msg = cid ? 'Dette enregistrée : '+fmt(total)+' pour '+custById(cid).name+'. Total dû : '+fmt(custById(cid).balance)+'.' : 'Vente encaissée : '+fmt(total)+'.';
    if(alerts.length) toast(msg+' Alerte stock : '+alerts.join(', ')+'.',true,5000);
    else toast(msg,false,3600);
  }

  var actions = {
    go:function(el){ ui.view=el.dataset.v; ui.sheet=null; render(); },
    add:function(el){ var id=el.dataset.id, p=byId(id), q=ui.cart[id]||0; if(p && q<p.qty){ ui.cart[id]=q+1; render(); } },
    sub:function(el){ var id=el.dataset.id, q=(ui.cart[id]||0)-1; if(q<=0) delete ui.cart[id]; else ui.cart[id]=q; render(); },
    sale:function(){ return run(function(){ return completeSale(null); }); },
    credit:function(){ if(!cartTotals().items) return; ui.sheet={type:'credit',sel:null}; render(); },
    creditPick:function(el){
      ui.sheet.sel=el.dataset.id;
      document.querySelectorAll('.pick').forEach(function(b){ b.setAttribute('aria-pressed', b===el ? 'true':'false'); });
      var n=$('c-name'), ph=$('c-phone'); if(n) n.value=''; if(ph) ph.value='';
    },
    creditConfirm:function(){
      return run(async function(){
        var name=$('c-name').value.trim(), cid=ui.sheet.sel;
        if(name){
          if(blocked('clients')) return;
          var r=await sb.from('customers').insert({shop_id:S.shop.id,name:name,phone:$('c-phone').value.trim()||null}).select().single();
          if(r.error) return fail(r.error);
          cid=r.data.id;
          S.customers.push({id:cid,name:name,phone:r.data.phone||'',balance:0});
        }
        if(!cid) return toast('Choisis un client ou écris un nouveau nom.',true);
        await completeSale(cid);
      });
    },
    newClient:function(){ if(blocked('clients')) return; ui.sheet={type:'clientForm'}; render(); },
    saveClient:function(){
      return run(async function(){
        var name=$('c-name').value.trim();
        if(!name) return toast('Écris le nom du client.',true);
        var r=await sb.from('customers').insert({shop_id:S.shop.id,name:name,phone:$('c-phone').value.trim()||null});
        if(r.error) return fail(r.error);
        ui.sheet=null; await refresh(); render(); toast('Client ajouté : '+name);
      });
    },
    openClient:function(el){ ui.sheet={type:'client',id:el.dataset.id}; render(); },
    payAll:function(el){ $('p-amt').value=el.dataset.amt; },
    payDebt:function(el){
      return run(async function(){
        var c=custById(el.dataset.id), a=parseInt($('p-amt').value,10);
        if(!(a>0)) return toast('Entre le montant payé par le client.',true);
        if(a>c.balance) return toast(c.name+' doit seulement '+fmt(c.balance)+'.',true);
        var r=await sb.from('debt_payments').insert({shop_id:S.shop.id,customer_id:c.id,amount:a});
        if(r.error) return fail(r.error);
        ui.sheet=null; await refresh(); render();
        var left=custById(c.id).balance;
        toast(left>0 ? 'Paiement de '+fmt(a)+' enregistré. Reste à payer : '+fmt(left)+'.' : 'Paiement enregistré. La dette de '+c.name+' est soldée.');
      });
    },
    openProduct:function(el){ ui.sheet={type:'product',id:el.dataset.id}; render(); },
    openForm:function(el){
      var id=el.dataset.id||null;
      if(!id && blocked('produits')) return;
      ui.sheet={type:'form',id:id}; render();
    },
    close:function(el,e){ if(e.target!==el) return; ui.sheet=null; render(); },
    entree:function(el){
      return run(async function(){
        var p=byId(el.dataset.id), q=parseInt($('m-qty').value,10);
        if(!(q>0)) return toast('Entre une quantité supérieure à 0.',true);
        var r=await sb.rpc('record_stock_movement',{p_shop_id:S.shop.id,p_product_id:p.id,p_kind:'entree',p_qty:q});
        if(r.error) return fail(r.error);
        ui.sheet=null; await refresh(); render(); toast('Entrée enregistrée : +'+q+' '+p.name);
      });
    },
    sortie:function(el){
      return run(async function(){
        var p=byId(el.dataset.id), q=parseInt($('m-qty').value,10);
        if(!(q>0)) return toast('Entre une quantité supérieure à 0.',true);
        if(q>p.qty) return toast('Le stock est de '+p.qty+'. Tu ne peux pas sortir '+q+'.',true);
        var before=snapshotQty();
        var r=await sb.rpc('record_stock_movement',{p_shop_id:S.shop.id,p_product_id:p.id,p_kind:'sortie',p_qty:q});
        if(r.error) return fail(r.error);
        ui.sheet=null; await refresh(); render();
        var al=newAlerts(before);
        if(al.length) toast('Sortie enregistrée. Alerte stock : '+al.join(', ')+'.',true,4000);
        else toast('Sortie enregistrée : −'+q+' '+p.name);
      });
    },
    saveForm:function(){
      return run(async function(){
        var name=$('f-name').value.trim(), buy=num0('f-buy'), sell=num0('f-sell'), qty=num0('f-qty'), th=num0('f-th');
        if(!name) return toast('Écris le nom du produit.',true);
        if([buy,sell,qty,th].some(function(x){return isNaN(x)||x<0;})) return toast('Remplis les prix et les quantités avec des nombres positifs.',true);
        var row={name:name,buy_price:Math.round(buy),sell_price:Math.round(sell),qty:Math.floor(qty),alert_threshold:Math.floor(th)};
        var r;
        if(ui.sheet.id){ r=await sb.from('products').update(row).eq('id',ui.sheet.id); }
        else { if(blocked('produits')) return; row.shop_id=S.shop.id; r=await sb.from('products').insert(row); }
        if(r.error) return fail(r.error);
        ui.sheet=null; await refresh(); render(); toast('Produit enregistré : '+name);
      });
    },
    archive:function(el){
      return run(async function(){
        var p=byId(el.dataset.id);
        var r=await sb.from('products').update({archived:true}).eq('id',p.id);
        if(r.error) return fail(r.error);
        delete ui.cart[p.id]; ui.sheet=null; await refresh(); render(); toast('Produit retiré : '+p.name);
      });
    },
    filter:function(el){ ui.filter=el.dataset.f; render(); },
    openPlan:function(el){ ui.sheet={type:'plan',why:el.dataset.why||''}; render(); },
    authToggle:function(){ ui.authMode = ui.authMode==='signup' ? 'login' : 'signup'; ui.authErr=''; ui.authMsg=''; render(); },
    logout:function(){
      return run(async function(){
        await sb.auth.signOut();
        S=fresh(); ui.view='home'; ui.sheet=null; ui.cart={}; ui.authMode='login'; ui.authErr=''; ui.authMsg=''; render();
      });
    },
    reload:function(){ return run(async function(){ await refresh(); render(); toast('Données actualisées.'); }); },
    retry:function(){
      return run(async function(){
        S.loadError='';
        try{ await refresh(); }catch(e){ S.loadError='Impossible de charger tes données. '+((e&&e.message)||''); }
        render();
      });
    },
    payOnline:function(){
      return run(async function(){
        var r=await sb.functions.invoke('create-payment',{body:{}});
        if(r.error || !r.data || !r.data.url){
          toast('Le paiement en ligne n\'est pas disponible pour le moment. Utilise le paiement à la main.',true,5000);
          return;
        }
        toast('Ouverture de la page de paiement…');
        location.href=r.data.url;
      });
    },
    reloadPage:function(){ location.reload(); }
  };

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-a]'); if(!el) return;
    var fn=actions[el.dataset.a]; if(fn) fn(el,e);
  });
  document.addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target.dataset.form;
    if(f==='auth') run(submitAuth);
    if(f==='shop') run(submitShop);
  });
  document.addEventListener('input',function(e){
    if(e.target.id==='q'){ ui.q=e.target.value; $('plist').innerHTML=sellList(); }
    if(e.target.id==='c-name' && ui.sheet && ui.sheet.type==='credit'){
      ui.sheet.sel=null;
      document.querySelectorAll('.pick').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
    }
  });
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible' || !sb || !S.user || !S.shop || ui.busy || ui.sheet || ui.view==='sell') return;
    refresh().then(render).catch(function(){});
  });

  /* ------------------------------------------------------------------
     DÉMARRAGE
     ------------------------------------------------------------------ */
  async function watchPayment(){
    toast('Vérification de ton paiement…',false,4000);
    for(var i=0;i<8;i++){
      await new Promise(function(r){ setTimeout(r,3000); });
      try{ await refresh(); }catch(e){}
      if(S.sub && S.sub.plan==='pro' && plan().type==='pro'){
        render(); toast('Abonnement Pro activé. Merci !',false,5000); return;
      }
    }
    toast('Paiement en cours de vérification. Actualise dans quelques minutes.',false,6000);
  }

  async function boot(){
    render();
    if(!sb) return;
    try{
      var g=await sb.auth.getSession();
      S.user = g.data && g.data.session ? g.data.session.user : null;
      if(S.user) await refresh();
    }catch(e){
      S.loadError='Impossible de charger tes données. '+((e&&e.message)||'');
    }
    ui.ready=true; render();
    var backToken=new URLSearchParams(location.search).get('token');
    if(backToken){
      try{ history.replaceState(null,'',location.pathname); }catch(e){}
      if(S.user && S.shop) watchPayment();
    }
    sb.auth.onAuthStateChange(function(event){
      if(event==='SIGNED_OUT' && S.user){ S=fresh(); render(); }
    });
  }
  boot();
})();
</script>
</body>
</html>
